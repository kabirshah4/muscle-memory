name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global init.defaultBranch main
      - name: Compile every Python file
        run: python -m compileall -q skills bench docs tests
      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -v tests
      - name: Charts match the committed benchmark data
        run: |
          python docs/make_charts.py
          git diff --exit-code docs/
